[package]
name = "tuiba"
description = "Game Boy Advance emulator running in your terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "tuiba"
path = "src/main.rs"

[[example]]
name = "padlog"
required-features = ["gamepad"]

[dependencies]
tuiba-core.workspace = true
thiserror.workspace = true
ratatui.workspace = true
crossterm.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
cpal = "0.18"
gilrs = { version = "0.11", optional = true }
miniz_oxide = "0.9"

[lints]
workspace = true

[features]
default = ["gamepad"]
# Game controllers through gilrs (evdev/libudev on Linux, Windows Gaming
# Input / XInput, IOKit on macOS). Without it only the keyboard plays.
gamepad = ["dep:gilrs"]

[package.metadata.binstall]
pkg-url = "https://github.com/Huseynteymurzade28/tuiba/releases/download/v{ version }/tuiba-v{ version }-{ target }.tar.gz"
bin-dir = "tuiba-v{ version }-{ target }/tuiba{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "https://github.com/Huseynteymurzade28/tuiba/releases/download/v{ version }/tuiba-v{ version }-{ target }.zip"
pkg-fmt = "zip"
